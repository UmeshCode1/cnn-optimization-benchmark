[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cnn-optimization-benchmark"
version = "2.5.0"
description = "Scientific Research Workstation & Laboratory Platform for Empirically Benchmarking Metaheuristic Optimization Algorithms on Deep CNN Compression"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Umesh Patel", email = "umesh@umeshlabs.in" }
]
maintainers = [
    { name = "Umesh Patel", email = "umesh@umeshlabs.in" }
]
keywords = [
    "deep-learning",
    "model-compression",
    "metaheuristic-algorithms",
    "neural-network-pruning",
    "quantization",
    "grey-wolf-optimizer",
    "whale-optimization-algorithm",
    "pareto-optimization",
    "benchmarking",
    "scientific-research"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.5.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "psutil>=5.9.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
real-mode = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pynvml>=11.5.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "anyio>=3.7.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://cnn.umeshlabs.in"
Repository = "https://github.com/UmeshCode1/cnn-optimization-benchmark"
Documentation = "https://github.com/UmeshCode1/cnn-optimization-benchmark/tree/master/docs"
"Bug Tracker" = "https://github.com/UmeshCode1/cnn-optimization-benchmark/issues"
Changelog = "https://github.com/UmeshCode1/cnn-optimization-benchmark/releases"

[project.scripts]
cnn-benchmark = "backend.main:main"
cnn-local = "local_runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "scripts*"]
exclude = ["frontend*", "tests*", "docs*"]
