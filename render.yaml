services:
  - type: web
    name: cnn-optimization-benchmark
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: cnn-benchmark-db
          property: connectionString

databases:
  - name: cnn-benchmark-db
    plan: free
    databaseName: cnn_benchmark
    user: cnn_user
