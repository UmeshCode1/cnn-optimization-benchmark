name: Release & Package Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build Distribution & GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Build Tooling
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build Python Distribution (sdist & wheel)
        run: |
          python -m build

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Assets
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Archive Frontend Static Bundle
        run: |
          tar -czvf frontend-dist-${{ github.ref_name }}.tar.gz -C frontend/dist .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "CNN Optimization Benchmark Platform ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            frontend-dist-${{ github.ref_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
